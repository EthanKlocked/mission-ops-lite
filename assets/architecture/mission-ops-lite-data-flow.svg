<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mission Ops Lite data flow</title>
  <desc id="desc">Data flow from public CelesTrak GP JSON through local ingestion, normalized catalog, derived estimates, dashboard views, simulated telemetry workflows, and data-platform definitions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#0d2f46"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#10233c"/>
      <stop offset="100%" stop-color="#123954"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b14" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .label { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e8f2ff; }
      .tag { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; fill: #67e8f9; }
      .body { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #bdd2ea; }
      .small { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9eb6d1; }
      .node { fill: url(#node); stroke: #2f6d98; stroke-width: 1.4; filter: url(#shadow); }
      .lane { fill: rgba(103,232,249,0.06); stroke: rgba(103,232,249,0.28); stroke-width: 1; stroke-dasharray: 8 8; }
      .arrow { stroke: #67e8f9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="64" class="tag">Mission Ops Lite</text>
  <text x="52" y="102" class="label" font-size="34">Public orbit data to local review and data-platform contracts</text>
  <text x="52" y="132" class="body">Public source data is separated from normalized local records, derived approximate outputs, simulation-backed workflows, and pipeline/schema definitions.</text>

  <rect x="40" y="170" width="1200" height="170" rx="22" class="lane"/>
  <text x="62" y="200" class="tag">Operational API and dashboard path</text>
  <rect x="70" y="228" width="190" height="78" rx="18" class="node"/>
  <text x="92" y="260" class="tag">Public source data</text>
  <text x="92" y="285" class="body">CelesTrak GP JSON</text>

  <rect x="315" y="228" width="190" height="78" rx="18" class="node"/>
  <text x="337" y="260" class="tag">Ingestion / cache</text>
  <text x="337" y="285" class="body">SQLite run history</text>

  <rect x="560" y="228" width="210" height="78" rx="18" class="node"/>
  <text x="582" y="260" class="tag">Normalized local data</text>
  <text x="582" y="285" class="body">Catalog + lineage fields</text>

  <rect x="825" y="198" width="185" height="72" rx="18" class="node"/>
  <text x="847" y="228" class="tag">Derived output</text>
  <text x="847" y="252" class="body">SGP4 position / orbit</text>

  <rect x="825" y="288" width="185" height="72" rx="18" class="node"/>
  <text x="847" y="318" class="tag">Derived output</text>
  <text x="847" y="342" class="body">Contact estimates</text>

  <rect x="1050" y="238" width="150" height="78" rx="18" class="node"/>
  <text x="1072" y="268" class="tag">Dashboard</text>
  <text x="1072" y="292" class="body">Local review views</text>

  <path class="arrow" d="M260 267 H315"/>
  <path class="arrow" d="M505 267 H560"/>
  <path class="arrow" d="M770 258 C795 250 800 236 825 234"/>
  <path class="arrow" d="M770 278 C795 286 800 318 825 324"/>
  <path class="arrow" d="M1010 234 C1030 240 1038 254 1050 266"/>
  <path class="arrow" d="M1010 324 C1030 318 1038 294 1050 286"/>

  <rect x="40" y="380" width="575" height="220" rx="22" class="lane"/>
  <text x="62" y="410" class="tag">Simulation-backed operations workflow</text>
  <rect x="70" y="438" width="200" height="88" rx="18" class="node"/>
  <text x="92" y="470" class="tag">Simulated telemetry</text>
  <text x="92" y="496" class="body">Scenario + seed</text>
  <text x="92" y="516" class="small">Not live spacecraft telemetry</text>

  <rect x="330" y="438" width="210" height="88" rx="18" class="node"/>
  <text x="352" y="470" class="tag">Events / policies</text>
  <text x="352" y="496" class="body">Timeline + comparison</text>
  <text x="352" y="516" class="small">Runbook-style summaries</text>
  <path class="arrow" d="M270 482 H330"/>
  <path class="arrow" d="M665 306 C570 358 500 412 430 438"/>

  <rect x="665" y="380" width="575" height="220" rx="22" class="lane"/>
  <text x="687" y="410" class="tag">Data-platform extension path</text>
  <rect x="695" y="438" width="155" height="88" rx="18" class="node"/>
  <text x="717" y="470" class="tag">Bronze</text>
  <text x="717" y="496" class="body">Raw lineage</text>

  <rect x="890" y="438" width="155" height="88" rx="18" class="node"/>
  <text x="912" y="470" class="tag">Silver</text>
  <text x="912" y="496" class="body">Typed snapshots</text>

  <rect x="1085" y="438" width="125" height="88" rx="18" class="node"/>
  <text x="1107" y="470" class="tag">Gold</text>
  <text x="1107" y="496" class="body">OLAP metrics</text>

  <path class="arrow" d="M850 482 H890"/>
  <path class="arrow" d="M1045 482 H1085"/>
  <path class="arrow" d="M665 306 C705 350 752 390 775 438"/>
  <text x="698" y="560" class="small">Databricks notebook definitions and Snowflake SQL contracts are pipeline/schema artifacts, not live workspace evidence.</text>

  <rect x="52" y="632" width="1176" height="48" rx="14" fill="rgba(5,16,30,0.75)" stroke="#2f6d98"/>
  <text x="76" y="662" class="small">Boundary: public CelesTrak orbit elements in; approximate derived estimates and simulated events out; no telecommand, live telemetry, or mission-grade validation claim.</text>
</svg>
